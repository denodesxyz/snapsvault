name: Bug report
description: Something in the Marketplace, the SnapsOS CLI, the REST API, the website or the docs does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security issues go to hello@denodes.io, not to a public issue. See SECURITY.md.
        A problem with a contributor's server or snapshot file goes to that contributor; the contact details are on its Marketplace page. A problem with a listing goes to the registry issues: https://github.com/denodesxyz/snapsvault-registry/issues
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Marketplace (celestia.snapsvault.xyz)
        - SnapsOS CLI
        - REST API
        - Website (snapsvault.xyz)
        - Docs (docs.snapsvault.xyz)
        - Registry or feed sync
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The page, API request or CLI command, and every step needed to see the bug.
      placeholder: |
        1. Open https://celestia.snapsvault.xyz/...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and OS for the web apps; OS, bash and jq versions for the CLI; commit or deployment if running locally.
      placeholder: Safari 18 on macOS 15
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or API output
      description: Paste text output as text. Remove any tokens or secrets first.
