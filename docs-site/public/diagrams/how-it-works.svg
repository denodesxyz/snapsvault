<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 616" width="720" font-family="sans-serif" font-size="14" role="img" aria-labelledby="t d">
  <title id="t">SnapsVault end-to-end path</title>
  <desc id="d">A contributor feed is listed in the registry, read by a sync every 2 minutes into the database, and served by the REST API to the Marketplace and the SnapsOS CLI.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8B7CF0"/>
    </marker>
  </defs>
  <g fill="none" stroke="#8B7CF0" stroke-width="1.5">
    <rect x="230" y="20" width="260" height="56" rx="6"/>
    <rect x="230" y="130" width="260" height="56" rx="6"/>
    <rect x="230" y="240" width="260" height="56" rx="6"/>
    <rect x="230" y="350" width="260" height="56" rx="6"/>
    <rect x="230" y="460" width="260" height="56" rx="6"/>
    <rect x="20" y="550" width="200" height="56" rx="6"/>
    <rect x="500" y="550" width="200" height="56" rx="6"/>
    <path d="M360 76V128" marker-end="url(#a)"/>
    <path d="M360 186V238" marker-end="url(#a)"/>
    <path d="M360 296V348" marker-end="url(#a)"/>
    <path d="M360 406V458" marker-end="url(#a)"/>
    <path d="M300 516L120 548" marker-end="url(#a)"/>
    <path d="M420 516L600 548" marker-end="url(#a)"/>
  </g>
  <g fill="#8a8a8a" text-anchor="middle">
    <text x="360" y="44">Contributor feed</text>
    <text x="360" y="63" font-size="12">index.json (HTTPS)</text>
    <text x="360" y="154">Registry</text>
    <text x="360" y="173" font-size="12">one JSON file per contributor</text>
    <text x="360" y="264">Sync</text>
    <text x="360" y="283" font-size="12">reads registry and feeds every 2 min</text>
    <text x="360" y="374">Database</text>
    <text x="360" y="393" font-size="12">current and archived snapshots</text>
    <text x="360" y="484">REST API</text>
    <text x="360" y="503" font-size="12">celestia.snapsvault.xyz/api</text>
    <text x="120" y="572">Marketplace</text>
    <text x="120" y="590" font-size="12">web app</text>
    <text x="600" y="572">SnapsOS CLI and scripts</text>
    <text x="600" y="590" font-size="12">bash, curl</text>
    <text x="378" y="108" font-size="12" text-anchor="start">feed URL listed per contributor</text>
  </g>
</svg>
